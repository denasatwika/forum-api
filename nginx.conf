limit_req_zone $binary_remote_addr zone=forumapi_limit:10m rate=90r/m;

server {
    listen 80;
    server_name gold-terms-wish-politely.st.a.dcdg.xyz www.gold-terms-wish-politely.st.a.dcdg.xyz;
    server_tokens off;

    location /threads {
        limit_req zone=forumapi_limit burst=50;
        limit_req_status 429;

        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
