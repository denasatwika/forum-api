services:
  postgres:
    image: postgres:16-alpine
    container_name: forum-api-db
    restart: "no"

    environment:
      POSTGRES_USER: ${PGUSER:-developer}
      POSTGRES_PASSWORD: ${PGPASSWORD:-supersecretpassword}
      POSTGRES_DB: ${PGDATABASE:-forumapi}

    ports:
      - "127.0.0.1:${PGPORT:-5440}:5432"

    tmpfs:
      - /var/lib/postgresql/data:rw,nosuid,nodev,noexec,size=512m

    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
